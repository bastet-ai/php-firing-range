worker_processes auto;
events { worker_connections 1024; }
http {
  access_log off;
  upstream phpsrv { server phpsrv:8080; }
  server {
    listen 80;
    # CTF-style: proxy everything to php -S (no fastcgi split)
    location / {
      proxy_pass http://phpsrv;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }
  }
}
