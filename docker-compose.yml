name: php-firing-range

services:
  shakedown:
    build: ./range/shakedown
    ports:
      - "127.0.0.1:8181:80"
    restart: unless-stopped

  php83:
    image: php:8.3-apache
    ports:
      - "127.0.0.1:8083:80"
    volumes:
      - ./range/surface:/var/www/html:ro
    restart: unless-stopped

  php82:
    image: php:8.2-apache
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - ./range/surface:/var/www/html:ro
    restart: unless-stopped

  php81:
    image: php:8.1-apache
    ports:
      - "127.0.0.1:8091:80"
    volumes:
      - ./range/surface:/var/www/html:ro
    restart: unless-stopped

  php56:
    image: php:5.6-apache
    ports:
      - "127.0.0.1:8056:80"
    volumes:
      - ./range/surface:/var/www/html:ro
    restart: unless-stopped

  phpbleed:
    build: ./range/phpbleed
    ports:
      - "127.0.0.1:8088:80"
    restart: unless-stopped

  bleed82:
    build: ./range/bleed82
    ports:
      - "127.0.0.1:8089:80"
    restart: unless-stopped

  bleed81arm:
    build: ./range/bleed81arm
    ports:
      - "127.0.0.1:8090:80"
    restart: unless-stopped

  bleedsrv:
    build: ./range/bleedsrv
    ports:
      - "127.0.0.1:8092:8080"
    restart: unless-stopped

  phpinfo:
    build: ./range/phpinfo
    ports:
      - "127.0.0.1:8093:80"
    restart: unless-stopped

  wordpress:
    image: wordpress:6-php8.2-apache
    platform: linux/arm64
    ports:
      - "127.0.0.1:8094:80"
    environment:
      WORDPRESS_DB_HOST: wpdb
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_DB_NAME: wp
    restart: unless-stopped
    depends_on:
      - wpdb

  wordpress-x86-83:
    # vulnerable WP on PINNED PRE-PATCH php 8.3.35: the minor version the
    # aarch64 lab's corrupt-token persistence evidence came from. Isolates
    # the 8.3.x pre-patch WP shape for the disclosure experiments.
    build: ./range/wordpress-x86-83
    ports:
      - "127.0.0.1:8101:80"
    environment:
      WORDPRESS_DB_HOST: wpdb-x86
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_DB_NAME: wp_83
    restart: unless-stopped
    depends_on:
      - wpdb-x86

  wordpress-patched:
    # matched PATCHED negative control for wordpress-x86 (php 8.2.35 =
    # the fixed release). Control fires are pre-script (session machinery);
    # wp_patched DB is intentionally not created - no table sharing with
    # the vulnerable lane.
    build: ./range/wordpress-patched
    ports:
      - "127.0.0.1:8100:80"
    environment:
      WORDPRESS_DB_HOST: wpdb-x86
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_DB_NAME: wp_patched
    restart: unless-stopped
    depends_on:
      - wpdb-x86

  wordpress-x86:
    build: ./range/wordpress-x86
    ports:
      - "127.0.0.1:8099:80"
    environment:
      WORDPRESS_DB_HOST: wpdb-x86
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_DB_NAME: wp
    restart: unless-stopped
    depends_on:
      - wpdb-x86

  wpdb-x86:
    # the wordpress-x86 lane's own DB (wpdb itself is for the original
    # arm64 census lane). NO platform pin: mysql:8.0 is multi-arch, so
    # each range box (x86_64 and aarch64) runs its HOST-NATIVE build -
    # a pin here breaks the OTHER box (bit us 2026-10-22: arm64 pin
    # exec-format-error'd on the x86_64 box; amd64 pin SIGSEGVs under
    # qemu on the aarch64 box). skip-name-resolve: mysqld reverse-DNS
    # added a flat 5s to every fresh WP db connection.
    image: mysql:8.0
    command: --skip-name-resolve
    environment:
      MYSQL_DATABASE: wp
      MYSQL_USER: wp
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    restart: unless-stopped

  wpdb:
    image: mysql:8.0
    platform: linux/arm64
    environment:
      MYSQL_DATABASE: wp
      MYSQL_USER: wp
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    restart: unless-stopped

  magento:
    image: shinsenter/magento:latest
    ports:
      - "127.0.0.1:8095:80"
    restart: unless-stopped
    command: ["sh","-c","php-fpm & nginx -g 'daemon off;'"]

  t4a:
    build: ./range/t4a
    ports:
      - "127.0.0.1:8098:80"
    restart: unless-stopped

  t4b:
    build: ./range/t4b
    ports:
      - "127.0.0.1:8096:80"
    restart: unless-stopped


  bleednoaslr:
    build: ./range/bleednoaslr
    ports:
      - "127.0.0.1:8097:80"
    restart: unless-stopped
    # setarch --addr-no-randomize needs personality(ADDR_NO_RANDOMIZE),
    # which Docker's default seccomp profile blocks. Lab container,
    # loopback-only: relax seccomp for THIS service only.
    security_opt:
      - seccomp:unconfined
