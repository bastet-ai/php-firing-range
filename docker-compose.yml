name: php-firing-range

services:
  shakedown:
    build: ./range/shakedown
    ports:
      - "127.0.0.1:8181:80"
    restart: unless-stopped

  php83:
    image: php:8.3-apache
    ports:
      - "127.0.0.1:8083:80"
    volumes:
      - ./range/surface:/var/www/html:ro
    restart: unless-stopped

  php82:
    image: php:8.2-apache
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - ./range/surface:/var/www/html:ro
    restart: unless-stopped

  php81:
    image: php:8.1-apache
    ports:
      - "127.0.0.1:8091:80"
    volumes:
      - ./range/surface:/var/www/html:ro
    restart: unless-stopped

  php56:
    image: php:5.6-apache
    ports:
      - "127.0.0.1:8056:80"
    volumes:
      - ./range/surface:/var/www/html:ro
    restart: unless-stopped

  phpbleed:
    build: ./range/phpbleed
    ports:
      - "127.0.0.1:8088:80"
    restart: unless-stopped

  bleed82:
    build: ./range/bleed82
    ports:
      - "127.0.0.1:8089:80"
    restart: unless-stopped

  bleed81arm:
    build: ./range/bleed81arm
    ports:
      - "127.0.0.1:8090:80"
    restart: unless-stopped

  bleedsrv:
    build: ./range/bleedsrv
    ports:
      - "127.0.0.1:8092:8080"
    restart: unless-stopped

  phpinfo:
    build: ./range/phpinfo
    ports:
      - "127.0.0.1:8093:80"
    restart: unless-stopped

  wordpress:
    image: wordpress:6-php8.2-apache
    ports:
      - "127.0.0.1:8094:80"
    environment:
      WORDPRESS_DB_HOST: wpdb
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_DB_NAME: wp
    restart: unless-stopped
    depends_on:
      - wpdb

  wpdb:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: wp
      MYSQL_USER: wp
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    restart: unless-stopped

  magento:
    image: magento/magento2-base:2.4.7-php8.3
    ports:
      - "127.0.0.1:8095:80"
    restart: unless-stopped
    command: ["tail","-f","/dev/null"]

